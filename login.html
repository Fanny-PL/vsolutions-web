<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · V Solutions</title>
  <meta name="description" content="Accede a tu cuenta de V Solutions.">
  <meta name="theme-color" content="#05030a">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/login.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body class="pagina-login">

  <!-- Fondo "El universo" + rayos de luz detrás de la tarjeta -->
  <div class="universo" aria-hidden="true">
    <div class="mancha mancha--1"></div>
    <div class="mancha mancha--2"></div>
    <div class="mancha mancha--3"></div>
    <div class="mancha mancha--4"></div>
    <div class="mancha mancha--cursor"></div>
    <svg class="rayos" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4a7ff" stop-opacity="0"/><stop offset=".5" stop-color="#e9dcff"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
        <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b57e0" stop-opacity="0"/><stop offset=".5" stop-color="#9fb4ff"/><stop offset="1" stop-color="#5b57e0" stop-opacity="0"/></linearGradient>
        <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e070cf" stop-opacity="0"/><stop offset=".5" stop-color="#f3b8ea"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
        <filter id="rayo-blur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <g class="rayos__grupo">
        <path d="M-50 640 C 200 420, 420 820, 640 560 S 980 300, 1080 420" stroke="url(#r1)" stroke-width="10" fill="none" class="rayo rayo--borroso" filter="url(#rayo-blur)"/>
        <path d="M-50 660 C 220 450, 430 840, 650 580 S 990 320, 1080 445" stroke="url(#r1)" stroke-width="2" fill="none" class="rayo"/>
        <path d="M-60 300 C 180 420, 380 140, 600 300 S 900 560, 1080 380" stroke="url(#r2)" stroke-width="14" fill="none" class="rayo rayo--borroso rayo--lento" filter="url(#rayo-blur)"/>
        <path d="M-60 320 C 190 440, 390 165, 610 320 S 910 580, 1080 400" stroke="url(#r2)" stroke-width="1.6" fill="none" class="rayo rayo--lento"/>
        <path d="M-40 860 C 260 760, 520 980, 760 820 S 960 700, 1080 760" stroke="url(#r3)" stroke-width="8" fill="none" class="rayo rayo--borroso" filter="url(#rayo-blur)"/>
      </g>
    </svg>
    <div class="grano"></div>
    <canvas id="estrellas"></canvas>
  </div>

  <!-- Esquinas superiores -->
  <header class="login-esquinas">
    <a href="index.html" class="marca" aria-label="V Solutions, volver al inicio">
      <img src="assets/img/logo-v.png" alt="" class="marca__v" width="53" height="46">
      <span class="marca__texto">SOLUTIONS<small></small></span>
    </a>
    <a href="index.html" class="btn btn--sm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Volver al inicio</span>
    </a>
  </header>

  <main class="login-centro">
    <div class="login-caja">
      <!-- El gatito vigila la tarjeta -->
      <div class="mascota mascota--mini" data-src="assets/img/gato.png" data-capas="10" data-separacion="1"
           data-frases="¡Miau! Bienvenido de nuevo|Tu cuenta está a salvo conmigo|¡Prrr!"
           role="button" tabindex="0" aria-label="Gatito mascota, haz clic para saludar"></div>

      <section class="login-tarjeta vidrio" aria-labelledby="login-titulo">
        <form id="form-login" data-modo="login" novalidate>
          <h1 id="login-titulo">Iniciar sesión</h1>
          <p class="login-sub" id="login-sub">Bienvenido de nuevo</p>

          <div class="campo solo-registro">
            <label class="sr-only" for="l-nombre">Nombre completo</label>
            <input id="l-nombre" name="nombre" type="text" placeholder="Nombre completo" autocomplete="name" disabled>
            <svg class="campo__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1C12.8 8 16 11.2 23 12 16 12.8 12.8 16 12 23 11.2 16 8 12.8 1 12 8 11.2 11.2 8 12 1Z"/></svg>
          </div>

          <div class="campo">
            <label class="sr-only" for="l-usuario">Usuario o correo</label>
            <input id="l-usuario" name="usuario" type="text" placeholder="Usuario" autocomplete="username" required>
            <svg class="campo__icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>

          <div class="campo">
            <label class="sr-only" for="l-clave">Contraseña</label>
            <input id="l-clave" name="clave" type="password" placeholder="Contraseña" autocomplete="current-password" minlength="6" required>
            <button type="button" class="campo__boton" id="ver-clave" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="campo__icono icono-oculto" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              <svg class="campo__icono icono-visible" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <label class="recordar solo-login">
            <input type="checkbox" name="recordar">
            <span class="recordar__caja" aria-hidden="true"></span>
            Recordarme
          </label>

          <button type="submit" class="btn btn--bloque login-boton" id="login-boton">Entrar</button>

          <p class="login-alt">
            <span id="alt-texto">¿No tienes cuenta?</span>
            <button type="button" id="cambiar-modo">Regístrate</button>
          </p>
        </form>
      </section>
    </div>
  </main>

  <!-- Esquinas inferiores (como en la referencia) -->
  <footer class="login-pie">
    <span>V Solutions®</span>
    <span aria-hidden="true">×</span>
    <span>El universo tecnológico</span>
  </footer>

  <script src="js/fondo.js" defer></script>
  <script src="js/mascota.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/login.js" defer></script>
</body>
</html>
